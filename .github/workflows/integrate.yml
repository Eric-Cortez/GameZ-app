name: Node Continuous Integration

on:
  pull_request:
    branches: [main]

jobs:
  test_pull_request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: PWD
        run: pwd
      - name: Navigate to project directory
        run: cd react-app
      - uses: actions/setup-node@v3
        with:
          node-version: 16.13.1
      - run: npm ci
      - run: npm test
      - run: CI=false npm run build
